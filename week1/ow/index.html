<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오버워치 전략 가이드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header main-header">
        <h1>옵기본</h1>
        <p>맵과 역할군을 고르면 승리 전략이 보입니다.</p>
    </header>

    <div class="container">
        <section class="step-section" id="step1">
            <h2>Step 1. 역할군 선택</h2>
            <div class="role-buttons">
                <div class="role-item" data-role="tank">
                    <img src="images/돌격.png" alt="돌격" class="role-icon">
                    <span>돌격 (Tank)</span>
                </div>
                <div class="role-item" data-role="damage">
                    <img src="images/공격.png" alt="공격" class="role-icon">
                    <span>공격 (Damage)</span>
                </div>
                <div class="role-item" data-role="support">
                    <img src="images/지원.png" alt="지원" class="role-icon">
                    <span>지원 (Support)</span>
                </div>
            </div>
        </section>

        <section class="step-section disabled" id="step2">
            <h2>Step 2. 맵 선택</h2>
            <div id="mapGrid"></div>
        </section>

        <section id="resultBox" class="hidden">
            <div class="result-header" style="display: flex; align-items: center; width: 100%; flex-wrap: wrap; gap: 15px;">
                <h2 id="resultTitle" class="result-title" style="margin: 0; flex: 1 1 auto;">맵 이름 - 역할군 전략</h2>
                
                <div class="tier-select-wrapper" style="display: inline-block;">
                    <select id="tierSelect" style="background: #1e2630; color: #ffffff; border: 1px solid var(--ow-orange, #f99e1a); padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; outline: none; font-size: 0.95em; transition: all 0.2s ease;">
                        <option value="all">모든 티어</option>
                        <option value="bronze">브론즈</option>
                        <option value="silver">실버</option>
                        <option value="gold">골드</option>
                        <option value="platinum">플래티늄</option>
                        <option value="diamond">다이아몬드</option>
                        <option value="master">마스터</option>
                        <option value="grandmaster">그랜드마스터 & 챔피언</option>
                    </select>
                </div>

                <div class="like-section" style="display: inline-block;">
                    <button id="likeBtn" class="like-btn">👍 추천해요 <span id="likeCount">0</span></button>
                </div>
            </div>
            
            <div class="card strategy-card">
                <h3>🗺️ 거점별 핵심 전략</h3>
                <ul id="strategyList"></ul>
            </div>

            <div id="roleDataContent" class="role-content-grid">
                </div>

            <div class="card comment-section">
                <h3>💬 맵 전술 토론 (방명록)</h3>
                
                <form id="commentForm" class="comment-form">
                    <input type="text" id="commentNickname" placeholder="닉네임 (2~12자)" minlength="2" maxlength="12" required>
                    <textarea id="commentContent" placeholder="이 맵의 꿀팁이나 궁금한 점을 남겨주세요! (5~300자)" minlength="5" maxlength="300" required></textarea>
                    <button type="submit" id="commentSubmitBtn">댓글 남기기</button>
                </form>

                <div id="commentList" class="comment-list">
                    <p style="text-align: center; color: #a0aec0;">댓글을 불러오는 중...</p>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js?v=202407"></script>
</body>
</html>
