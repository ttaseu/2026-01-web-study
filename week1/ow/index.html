<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오버워치 전략 가이드</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>옵기본</h1>
        <p>맵과 역할군을 고르면 승리 전략이 보입니다.</p>
    </header>

    <div class="container">
        <!-- Step 1: 역할군 선택 -->
        <section class="step-section" id="step1">
            <h2>Step 1. 역할군 선택</h2>
            <div class="role-buttons">
                <div class="role-item" data-role="tank">
                    <img src="images/돌격.png" alt="돌격" class="role-icon">
                    <span>돌격 (Tank)</span>
                </div>
                <div class="role-item" data-role="damage">
                    <img src="images/공격.png" alt="공격" class="role-icon">
                    <span>공격 (Damage)</span>
                </div>
                <div class="role-item" data-role="support">
                    <img src="images/지원.png" alt="지원" class="role-icon">
                    <span>지원 (Support)</span>
                </div>
            </div>
        </section>

        <!-- Step 2: 맵 선택 -->
        <section class="step-section disabled" id="step2">
            <h2>Step 2. 맵 선택</h2>
            <div id="mapGrid"></div>
        </section>

        <!-- 결과창 -->
        <section id="resultBox" class="hidden">
            <div class="result-header">
                <h2 id="resultTitle" class="result-title">맵 이름 - 역할군 전략</h2>
                <div class="like-section">
                    <button id="likeBtn" class="like-btn">👍 추천해요 <span id="likeCount">0</span></button>
                </div>
            </div>
            
            <div class="card strategy-card">
                <h3>🗺️ 거점별 핵심 전략</h3>
                <ul id="strategyList"></ul>
            </div>

            <div id="roleDataContent" class="role-content-grid">
                <!-- JS에서 추천 영웅, 시너지, 카운터 내용이 렌더링됩니다 -->
            </div>

            <!-- 💬 댓글(방명록) 기능 추가 -->
            <div class="card comment-section">
                <h3>💬 맵 전술 토론 (방명록)</h3>
                
                <form id="commentForm" class="comment-form">
                    <input type="text" id="commentNickname" placeholder="닉네임 (2~12자)" minlength="2" maxlength="12" required>
                    <textarea id="commentContent" placeholder="이 맵의 꿀팁이나 궁금한 점을 남겨주세요! (5~300자)" minlength="5" maxlength="300" required></textarea>
                    <button type="submit" id="commentSubmitBtn">댓글 남기기</button>
                </form>

                <div id="commentList" class="comment-list">
                    <p style="text-align: center; color: #a0aec0;">댓글을 불러오는 중...</p>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js?v=202407"></script>
</body>
</html>
